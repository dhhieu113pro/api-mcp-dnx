name: Build and publish NuGet package

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package_version:
        description: 'SemVer package version (leave empty to use the project version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ApiMcp.Tests/ApiMcp.Tests.csproj

      - name: Test
        run: dotnet test ApiMcp.Tests/ApiMcp.Tests.csproj --configuration Release --no-restore

  package:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.package_version }}" ]]; then
            VERSION="${{ inputs.package_version }}"
          else
            VERSION="1.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore ApiMcp/ApiMcp.csproj

      - name: Build
        run: >-
          dotnet build ApiMcp/ApiMcp.csproj
          --configuration Release
          --no-restore
          /p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: >-
          dotnet pack ApiMcp/ApiMcp.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          /p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: dhhieu113

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate